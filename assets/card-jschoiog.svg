<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img" aria-label="JSChoIog: Notion으로 쓰는 기술 블로그">
  <style>.f{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic","Segoe UI",sans-serif}</style>
  <defs><clipPath id="r"><rect width="400" height="270" rx="22"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="400" height="270" fill="#0E1424"/>
    <rect y="160" width="400" height="110" fill="#151D36"/>
    <!-- a post, being written -->
    <rect x="34" y="34" width="150" height="16" rx="8" fill="#F5F7FB"/>
    <rect x="34" y="66" width="208" height="9" rx="4.5" fill="#3A4670"/>
    <rect x="34" y="86" width="186" height="9" rx="4.5" fill="#3A4670"/>
    <rect x="34" y="106" width="120" height="9" rx="4.5" fill="#3A4670"/>
    <rect x="160" y="100" width="3" height="20" fill="#FF7A1A"/>
    <!-- tangerine planet -->
    <ellipse cx="314" cy="84" rx="64" ry="18" fill="none" stroke="#FFB877" stroke-width="5" transform="rotate(-18 314 84)"/>
    <circle cx="314" cy="84" r="36" fill="#FF7A1A"/>
    <path d="M254 104a64 18 -18 0 0 121-39" fill="none" stroke="#FFB877" stroke-width="5" stroke-linecap="round"/>
    <text class="f" x="28" y="206" font-size="27" font-weight="800" fill="#F5F7FB">JSChoIog</text>
    <text class="f" x="28" y="233" font-size="15" font-weight="500" fill="#AEB7CB">Notion으로 쓰고 Next.js로 만든 기술 블로그</text>
    <text class="f" x="28" y="254" font-size="12.5" font-weight="600" fill="#FF9A4D">Next.js · TypeScript · Tailwind CSS</text>
  </g>
  <rect x="1" y="1" width="398" height="268" rx="21" fill="none" stroke="#2B3760" stroke-width="2"/>
